  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f0; color: #333; }

  .header p { font-size: 13px; opacity: 0.85; }

  .tabs { display: flex; background: #3a6b1e; }
  .tab { flex: 1; text-align: center; padding: 10px; color: white; cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 3px solid transparent; transition: 0.2s; }
  .tab:hover { background: rgba(255,255,255,0.1); }
  .tab.active { border-bottom-color: #ffd700; background: rgba(255,255,255,0.15); }

  .view { display: none; padding: 16px; }
  .view.active { display: block; }

  /* OVERVIEW */
  .garden-container { overflow-x: auto; padding: 10px 0; }
  .garden { display: flex; flex-direction: column; align-items: center; min-width: 1100px; gap: 4px; }
  .row-group { display: flex; align-items: stretch; width: 100%; }
  .row-label { width: 90px; min-width: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 11px; font-weight: 700; color: #555; padding: 2px 4px; text-align: center; }
  .row-label .season { font-size: 9px; color: #888; margin-top: 2px; }
  .bed-half { display: flex; flex: 1; gap: 1px; }
  .center-aisle { width: 30px; min-width: 30px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #999; writing-mode: vertical-lr; background: #e8e4d8; border-radius: 3px; }
  .plot { flex: 1; min-width: 0; padding: 4px 2px; border-radius: 3px; cursor: pointer; text-align: center; display: flex; flex-direction: column; justify-content: center; transition: 0.15s; border: 1px solid rgba(0,0,0,0.08); }
  .plot:hover { transform: scale(1.03); z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .plot .ploc { font-size: 10px; font-weight: 900; line-height: 1; margin-bottom: 1px; }
  .plot .pname { font-size: 8px; font-weight: 600; line-height: 1.15; overflow: hidden; }
  .plot .pinfo { font-size: 7px; opacity: 0.7; margin-top: 1px; }

  .walkway { height: 12px; width: 100%; display: flex; align-items: center; justify-content: center; }
  .walkway span { font-size: 8px; color: #aaa; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.15); }

  .compass { position: fixed; bottom: 16px; right: 16px; background: white; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 11px; font-weight: 700; z-index: 100; }
  .compass .n { position: absolute; top: 3px; }
  .compass .s { position: absolute; bottom: 3px; font-size: 9px; color: #999; }

  /* BED DETAIL */
  .bed-detail { max-width: 900px; margin: 0 auto; }
  .bed-selector { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; justify-content: center; }
  .bed-btn { padding: 6px 12px; border: 2px solid #ccc; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; background: white; transition: 0.15s; }
  .bed-btn:hover { border-color: #2d5016; }
  .bed-btn.active { background: #2d5016; color: white; border-color: #2d5016; }

  .bed-view { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .bed-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; color: #2d5016; }
  .bed-subtitle { font-size: 12px; color: #777; margin-bottom: 14px; }

  .variety-section { margin-bottom: 16px; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; }
  .variety-header { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; transition: 0.15s; }
  .variety-header:hover { filter: brightness(0.95); }
  .variety-header .arrow { transition: 0.2s; }
  .variety-header .arrow.open { transform: rotate(90deg); }
  .variety-meta { font-size: 11px; font-weight: 400; opacity: 0.75; }

  .variety-grid-container { padding: 10px; background: #fafaf7; display: none; }
  .variety-grid-container.open { display: block; }
  .grid-info { font-size: 11px; color: #666; margin-bottom: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
  .grid-info span { background: #eee; padding: 2px 8px; border-radius: 10px; }

  .plant-grid { display: inline-grid; gap: 1px; border: 1px solid #ccc; background: #ccc; border-radius: 4px; overflow: hidden; max-height: 400px; overflow-y: auto; }
  .plant-cell { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 7px; }
  .plant-cell.soil { background: #d4c9a8; }
  .plant-cell.plant { background: #6aad3a; border-radius: 50%; margin: 1px; }

  .grid-scale { margin-top: 6px; font-size: 10px; color: #999; }

  /* PLANTING GUIDE */
  .guide-table { width: 100%; border-collapse: collapse; font-size: 11px; background: white; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .guide-table th { background: #2d5016; color: white; padding: 8px 6px; text-align: left; font-size: 11px; position: sticky; top: 0; z-index: 2; }
  .guide-table td { padding: 6px; border-bottom: 1px solid #eee; }
  .guide-table tr:hover { background: #f0f7e6; }
  .guide-table .loc { font-weight: 700; text-align: center; width: 36px; }

  .search-bar { margin-bottom: 12px; }
  .search-bar input { width: 100%; padding: 10px 14px; border: 2px solid #ccc; border-radius: 6px; font-size: 14px; }
  .search-bar input:focus { outline: none; border-color: #2d5016; }

  @media print {
    .tabs, .compass, .search-bar, .bed-selector { display: none !important; }
    .view { display: block !important; page-break-after: always; }
    .plot { font-size: 7px !important; }
  }

  /* Colors per crop type */
  .c-dahlia { background: #e8a0b0; color: #4a1020; }

  .c-empty { background: #e0ddd0; color: #999; }

// ============================================================
// OVERVIEW BUILDER
// ============================================================
function buildOverview() {
  const g = document.getElementById('gardenOverview');
  let html = '<div style="text-align:center;font-size:10px;color:#888;margin-bottom:4px;">NORTH &larr; &nbsp; Entrance at center &nbsp; &rarr; SOUTH</div>';

  // Physical bed order: Bed 6 closest to entrance, then 1,2,3,4,5 (farthest)
  // Display top=farthest, bottom=entrance, so render: 5,4,3,2,1,6
  const physicalOrder = [5,4,3,2,1,6].map(n => rows.find(r => r.num === n));
  for (let i = 0; i < physicalOrder.length; i++) {
    const r = physicalOrder[i];
    if (i > 0) {
      html += '<div class="walkway"><span>— 5 ft walkway —</span></div>';
    }
    html += '<div class="row-group">';
    html += `<div class="row-label">${r.label} N<div class="season">${r.season}</div></div>`;
    html += '<div class="bed-half">';
    r.north.forEach(loc => {
      const v = vMap[loc];
      if (v) {
        const shortName = v.name.replace(/^(Dahlia|Scabiosa|Matricaria|Dianthus|Snapdragon|Zinnia|Limonium|Gomphrena|Ageratum|Celosia|Sorghum Orn\.|Marigold|Rudbeckia|Craspedia|Verbena bonariensis|Sunflower|Flowering Kale)\s*/, '');
        html += `<div class="plot c-${v.crop}" onclick="goToDetail(${v.loc})" title="#${v.loc} ${v.name}\n${v.spacing}/sqft · ${v.qty} plants">
          <div class="ploc">#${v.loc}</div>
          <div class="pname">${shortName}</div>
          <div class="pinfo">${v.spacing}/ft²</div>
        </div>`;
      }
    });
    html += '</div>';
    html += '<div class="center-aisle">CENTER AISLE</div>';
    html += '<div class="bed-half">';
    r.south.forEach(loc => {
      const v = vMap[loc];
      if (v) {
        const shortName = v.name.replace(/^(Dahlia|Scabiosa|Matricaria|Dianthus|Snapdragon|Zinnia|Limonium|Gomphrena|Ageratum|Celosia|Sorghum Orn\.|Marigold|Rudbeckia|Craspedia|Verbena bonariensis|Sunflower|Flowering Kale)\s*/, '');
        html += `<div class="plot c-${v.crop}" onclick="goToDetail(${v.loc})" title="#${v.loc} ${v.name}\n${v.spacing}/sqft · ${v.qty} plants">
          <div class="ploc">#${v.loc}</div>
          <div class="pname">${shortName}</div>
          <div class="pinfo">${v.spacing}/ft²</div>
        </div>`;
      }
    });
    html += '</div>';
    html += `<div class="row-label">${r.label} S<div class="season">${r.season}</div></div>`;
    html += '</div>';
  }

  html += '<div style="text-align:center;font-size:10px;color:#888;margin-top:8px;">&#9660; ENTRANCE / FENCE GATE &#9660;</div>';
  g.innerHTML = html;

  // Legend
  const leg = document.getElementById('legend');
  const seen = new Set();
  let lhtml = '';
  varieties.forEach(v => {
    if (!seen.has(v.crop)) {
      seen.add(v.crop);
      lhtml += `<div class="legend-item"><div class="legend-swatch" style="background:${cropColors[v.crop]}"></div>${v.crop.charAt(0).toUpperCase()+v.crop.slice(1)}</div>`;
    }
  });
  leg.innerHTML = lhtml;
}

// ============================================================
// BED DETAIL BUILDER
// ============================================================
function buildBedSelector() {
  const sel = document.getElementById('bedSelector');
  let html = '';
  rows.forEach(r => {
    html += `<div class="bed-btn" data-bed="${r.num}N" onclick="showBed(${r.num},'N')">${r.label} North</div>`;
    html += `<div class="bed-btn" data-bed="${r.num}S" onclick="showBed(${r.num},'S')">${r.label} South</div>`;
  });
  sel.innerHTML = html;
}

function showBed(num, side) {
  // Highlight button
  document.querySelectorAll('.bed-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.bed-btn[data-bed="${num}${side}"]`).classList.add('active');

  const r = rows.find(r => r.num === num);
  const locs = side === 'N' ? r.north : r.south;
  const bedName = `${r.label} ${side === 'N' ? 'North' : 'South'}`;
  const isSunflower = num >= 4;
  const sectionLen = isSunflower ? 16 : 8;

  let html = `<div class="bed-title">${bedName}</div>`;
  html += `<div class="bed-subtitle">3 ft wide × ~${locs.length * sectionLen} ft long · ${locs.length} varieties · ${sectionLen} ft per variety section</div>`;

  locs.forEach(loc => {
    const v = vMap[loc];
    if (!v) return;
    const totalPlants = v.spacing * v.sqft;
    const bedWidth = 3; // feet
    const bedLen = v.sqft / bedWidth;

    // Calculate grid dimensions
    let colsPerFt, rowsPerFt;
    if (v.spacing === 1) { colsPerFt = 1; rowsPerFt = 1; }
    else if (v.spacing === 2) { colsPerFt = 1; rowsPerFt = 2; }
    else if (v.spacing === 4) { colsPerFt = 2; rowsPerFt = 2; }
    else if (v.spacing === 6) { colsPerFt = 2; rowsPerFt = 3; }
    else if (v.spacing === 8) { colsPerFt = 2; rowsPerFt = 4; }
    else if (v.spacing === 10) { colsPerFt = 2; rowsPerFt = 5; }
    else { colsPerFt = Math.round(Math.sqrt(v.spacing)); rowsPerFt = Math.ceil(v.spacing / colsPerFt); }

    const totalCols = colsPerFt * bedWidth;
    const totalRows = rowsPerFt * bedLen;
    const inchSpacingX = Math.round(36 / totalCols * 10) / 10;
    const inchSpacingY = Math.round((bedLen * 12) / totalRows * 10) / 10;

    html += `<div class="variety-section">`;
    html += `<div class="variety-header c-${v.crop}" onclick="toggleGrid(this)">
      <div>
        <span class="arrow">&#9654;</span> #${v.loc} — ${v.name}
        <span class="variety-meta">&nbsp;|&nbsp;${v.breeder}</span>
      </div>
      <div class="variety-meta">${v.spacing}/ft² · ${totalPlants} plants · ${v.netting === 'Y' ? 'Netting' : 'No net'}</div>
    </div>`;
    html += `<div class="variety-grid-container">`;
    html += `<div class="grid-info">
      <span>Bed section: ${bedWidth} ft × ${bedLen} ft = ${v.sqft} ft²</span>
      <span>Spacing: ~${inchSpacingX}" × ${inchSpacingY}"</span>
      <span>Grid: ${totalCols} across × ${totalRows} long</span>
      <span>Total plants: ${totalPlants}</span>
      ${v.notes ? `<span>${v.notes}</span>` : ''}
    </div>`;

    // Build the visual grid (show up to 8ft of length, note if truncated)
    const showRows = Math.min(totalRows, rowsPerFt * 4); // show 4ft worth
    const truncated = totalRows > showRows;

    html += `<div style="overflow:auto; max-width:100%;">`;
    html += `<div style="display:inline-block;">`;
    // Column ruler
    html += `<div style="display:flex; gap:1px; margin-bottom:2px; margin-left:28px;">`;
    for (let c = 0; c < totalCols; c++) {
      const ftMark = Math.floor(c / colsPerFt);
      if (c % colsPerFt === 0) {
        html += `<div style="width:18px; text-align:center; font-size:7px; color:#999;">${ftMark}'</div>`;
      } else {
        html += `<div style="width:19px;"></div>`;
      }
    }
    html += `</div>`;

    for (let r = 0; r < showRows; r++) {
      const ftMarkY = (r / rowsPerFt).toFixed(1);
      html += `<div style="display:flex; align-items:center; gap:1px;">`;
      // Row label
      if (r % rowsPerFt === 0) {
        html += `<div style="width:26px; text-align:right; font-size:7px; color:#999; padding-right:2px;">${Math.floor(r/rowsPerFt)}'</div>`;
      } else {
        html += `<div style="width:26px;"></div>`;
      }
      for (let c = 0; c < totalCols; c++) {
        html += `<div style="width:18px;height:18px;border-radius:50%;background:${cropColors[v.crop]};border:1px solid rgba(0,0,0,0.15);display:flex;align-items:center;justify-content:center;font-size:6px;color:rgba(0,0,0,0.4);">&#9679;</div>`;
      }
      html += `</div>`;
    }
    if (truncated) {
      html += `<div style="text-align:center;font-size:10px;color:#999;padding:4px;">⋮ continues for ${bedLen} ft total (${totalRows} rows) ⋮</div>`;
    }
    html += `</div></div>`;

    html += `<div class="grid-scale">Each dot = 1 plant position. Showing ${Math.min(4, bedLen)} ft of ${bedLen} ft bed section. Row ruler on left, column ruler on top (in feet).</div>`;
    html += `</div></div>`;
  });

  document.getElementById('bedView').innerHTML = html;
}

function toggleGrid(header) {
  const arrow = header.querySelector('.arrow');
  const container = header.nextElementSibling;
  arrow.classList.toggle('open');
  container.classList.toggle('open');
}

function goToDetail(loc) {
  // Figure out which bed this loc belongs to
  for (const r of rows) {
    if (r.north.includes(loc)) {
      showView2('detail');
      showBed(r.num, 'N');
      // Open that specific variety
      setTimeout(() => {
        const sections = document.querySelectorAll('.variety-section');
        sections.forEach(s => {
          if (s.querySelector('.variety-header').textContent.includes('#'+loc)) {
            s.querySelector('.variety-header').click();
            s.scrollIntoView({behavior:'smooth', block:'center'});
          }
        });
      }, 100);
      return;
    }
    if (r.south.includes(loc)) {
      showView2('detail');
      showBed(r.num, 'S');
      setTimeout(() => {
        const sections = document.querySelectorAll('.variety-section');
        sections.forEach(s => {
          if (s.querySelector('.variety-header').textContent.includes('#'+loc)) {
            s.querySelector('.variety-header').click();
            s.scrollIntoView({behavior:'smooth', block:'center'});
          }
        });
      }, 100);
      return;
    }
  }
}

function showView2(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  document.querySelectorAll('.tab')[id==='overview'?0:id==='detail'?1:2].classList.add('active');
}

// PLANTING GUIDE TABLE
// ============================================================
function buildGuide() {
  const t = document.getElementById('guideTable');
  let html = `<thead><tr>
    <th>Loc#</th><th>Bed</th><th>Side</th><th>Variety Name</th><th>Crop</th><th>Breeder</th>
    <th>Spacing</th><th>Qty</th><th>Bed ft²</th><th>Netting</th><th>Notes</th>
  </tr></thead><tbody>`;

  varieties.forEach(v => {
    let bedNum, side;
    for (const r of rows) {
      if (r.north.includes(v.loc)) { bedNum = r.num; side = 'North'; break; }
      if (r.south.includes(v.loc)) { bedNum = r.num; side = 'South'; break; }
    }
    html += `<tr>
      <td class="loc">${v.loc}</td>
      <td>${bedNum}</td>
      <td>${side}</td>
      <td><strong>${v.name}</strong></td>
      <td>${v.crop}</td>
      <td>${v.breeder}</td>
      <td>${v.spacing}/ft²</td>
      <td>${v.qty}</td>
      <td>${v.sqft}</td>
      <td>${v.netting}</td>
      <td>${v.notes}</td>
    </tr>`;
  });
  html += '</tbody>';
  t.innerHTML = html;
}

function filterGuide() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const rows = document.querySelectorAll('#guideTable tbody tr');
  rows.forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}
